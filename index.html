<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e8">
<title>Tic Tac Together</title>
<style>
:root{--ink:#17316b;--muted:#64748b;--line:#eadfca;--gold:#ffd95a;--bg1:#dff4ff;--bg2:#fff9e8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2) 46%,#f3ffd9);-webkit-tap-highlight-color:transparent}
button,select{font:inherit}
.app{width:min(100%,480px);margin:0 auto;padding:18px 16px 28px}
.hero{text-align:center;padding:8px 6px 14px}
h1{font-size:clamp(34px,10vw,48px);line-height:.95;margin:0;font-weight:1000;letter-spacing:-.05em}
h1 span:nth-child(1){color:#2f80ed}h1 span:nth-child(2){color:#ff7a2f}h1 span:nth-child(3){color:#a855f7}
.sub{margin:10px 0 0;font-size:15px;font-weight:800;color:#46546d}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0 12px}
.card{background:rgba(255,255,255,.88);border:2px solid rgba(255,255,255,.9);border-radius:22px;padding:11px;text-align:center;box-shadow:0 8px 22px rgba(23,49,107,.08)}
.card.active{outline:4px solid var(--gold);transform:translateY(-1px)}
.piece{font-size:36px;line-height:1}.name{font-size:14px;font-weight:900;margin-top:4px}.wins{font-size:28px;font-weight:1000}
.vs{font-weight:1000;color:#6b7280}
.status{text-align:center;font-size:20px;font-weight:1000;min-height:32px;margin:8px 0 10px}
.celebrate{text-align:center;min-height:34px;font-size:28px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:rgba(255,255,255,.5);padding:10px;border-radius:28px}
.cell{aspect-ratio:1;border:none;border-radius:22px;background:#fffdfa;box-shadow:inset 0 0 0 2px #efdcb6,0 6px 15px rgba(23,49,107,.08);display:grid;place-items:center;font-size:clamp(48px,18vw,72px);cursor:pointer;touch-action:manipulation;transition:.14s ease}
.cell:active{transform:scale(.95)}
.cell.win{background:#fff3a6;box-shadow:inset 0 0 0 4px #ffc83d,0 8px 16px rgba(255,200,61,.25)}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{border:none;border-radius:16px;min-height:50px;font-weight:1000;padding:0 16px;cursor:pointer}
.primary{flex:1;background:linear-gradient(180deg,#25c865,#19a94f);color:white;box-shadow:0 8px 18px rgba(25,169,79,.2)}
.secondary{background:white;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.theme{display:flex;align-items:center;gap:10px;margin-top:12px;background:rgba(255,255,255,.75);padding:10px;border-radius:16px}
.theme label{font-size:13px;font-weight:900}
select{flex:1;min-width:0;border:1px solid var(--line);background:white;border-radius:12px;min-height:44px;padding:0 10px;color:var(--ink);font-weight:800}
.footer{text-align:center;color:#64748b;font-size:12px;font-weight:700;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .42s ease both}@keyframes pop{0%{transform:scale(.65);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}}
</style>
</head>
<body>
<main class="app">
<section class="hero">
<h1><span>Tic</span> <span>Tac</span><br><span>Together</span></h1>
<p class="sub">No ads. No distractions. Just play together. 💛</p>
</section>

<section class="score" aria-label="Scoreboard">
<div id="kidCard" class="card active"><div id="kidPiece" class="piece">🦁</div><div class="name">Kid</div><div id="kidWins" class="wins">0</div></div>
<div class="vs">VS</div>
<div id="parentCard" class="card"><div id="parentPiece" class="piece">🐘</div><div class="name">Parent</div><div id="parentWins" class="wins">0</div></div>
</section>

<div id="celebrate" class="celebrate" aria-hidden="true"></div>
<div id="status" class="status" aria-live="polite">Kid's turn 🦁</div>

<section id="board" class="board" aria-label="Tic tac toe board">
<button class="cell" data-i="0" aria-label="Top left square"></button>
<button class="cell" data-i="1" aria-label="Top middle square"></button>
<button class="cell" data-i="2" aria-label="Top right square"></button>
<button class="cell" data-i="3" aria-label="Middle left square"></button>
<button class="cell" data-i="4" aria-label="Center square"></button>
<button class="cell" data-i="5" aria-label="Middle right square"></button>
<button class="cell" data-i="6" aria-label="Bottom left square"></button>
<button class="cell" data-i="7" aria-label="Bottom middle square"></button>
<button class="cell" data-i="8" aria-label="Bottom right square"></button>
</section>

<div class="actions">
<button id="newRound" class="btn primary">New Round</button>
<button id="resetScore" class="btn secondary">Reset</button>
</div>

<div class="theme">
<label for="theme">Pieces</label>
<select id="theme">
<option value="animals">🦁 Kid vs 🐘 Parent</option>
<option value="classic">❌ Kid vs ⭕ Parent</option>
<option value="space">🚀 Kid vs 🪐 Parent</option>
<option value="sports">⚽ Kid vs 🏀 Parent</option>
<option value="sweet">💖 Kid vs ⭐ Parent</option>
<option value="dino">🦖 Kid vs 🦕 Parent</option>
</select>
</div>

<div class="footer">Made for playing together.</div>
</main>

<script>
const cells=[...document.querySelectorAll('.cell')];
const statusEl=document.getElementById('status');
const celebrate=document.getElementById('celebrate');
const kidCard=document.getElementById('kidCard');
const parentCard=document.getElementById('parentCard');
const kidWins=document.getElementById('kidWins');
const parentWins=document.getElementById('parentWins');
const kidPiece=document.getElementById('kidPiece');
const parentPiece=document.getElementById('parentPiece');
const theme=document.getElementById('theme');
const themes={animals:['🦁','🐘'],classic:['❌','⭕'],space:['🚀','🪐'],sports:['⚽','🏀'],sweet:['💖','⭐'],dino:['🦖','🦕']};
const winLines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board=Array(9).fill(''),turn=0,ended=false,scores=[0,0],pieces=themes.animals,starter=0;

function findWinner(){
  for(const line of winLines){
    const [a,b,c]=line;
    if(board[a]&&board[a]===board[b]&&board[a]===board[c]) return {player:board[a]-1,line};
  }
  return null;
}
function render(){
  cells.forEach((cell,i)=>{
    cell.textContent=board[i]?pieces[board[i]-1]:'';
    cell.disabled=ended||!!board[i];
    cell.classList.remove('win');
  });
  kidPiece.textContent=pieces[0];
  parentPiece.textContent=pieces[1];
  kidWins.textContent=scores[0];
  parentWins.textContent=scores[1];
  kidCard.classList.toggle('active',!ended&&turn===0);
  parentCard.classList.toggle('active',!ended&&turn===1);
  if(!ended) statusEl.textContent=(turn===0?"Kid's":"Parent's")+' turn '+pieces[turn];
}
function play(i){
  if(ended||board[i]) return;
  board[i]=turn+1;
  const win=findWinner();
  if(win){
    ended=true;scores[win.player]++;render();
    win.line.forEach(n=>cells[n].classList.add('win'));
    statusEl.textContent=(win.player===0?'Kid':'Parent')+' wins! 🎉';
    celebrate.textContent='🎉 ✨ 🎊 ✨ 🎉';
    celebrate.classList.remove('pop');void celebrate.offsetWidth;celebrate.classList.add('pop');
    return;
  }
  if(board.every(Boolean)){
    ended=true;render();statusEl.textContent="It's a tie! 🤝";celebrate.textContent='⭐ 🤝 ⭐';return;
  }
  turn=1-turn;render();
}
function newRound(){
  board=Array(9).fill('');ended=false;starter=1-starter;turn=starter;celebrate.textContent='';render();
}
cells.forEach(c=>c.addEventListener('click',()=>play(Number(c.dataset.i))));
document.getElementById('newRound').addEventListener('click',newRound);
document.getElementById('resetScore').addEventListener('click',()=>{
  scores=[0,0];board=Array(9).fill('');ended=false;starter=0;turn=0;celebrate.textContent='';render();
});
theme.addEventListener('change',()=>{
  pieces=themes[theme.value]||themes.animals;board=Array(9).fill('');ended=false;celebrate.textContent='';render();
});
render();
</script>
</body>
</html>
